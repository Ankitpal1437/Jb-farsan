<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jairamdas Bhojraj (JB) Farsan — Premium Indian Namkeen, Ulhasnagar Since 1972</title>
<meta name="description" content="JB Farsan — Ulhasnagar's legacy namkeen and farsan house since 1972. Order Kolhapuri Mix, Chewda, Papdi, Bhel and more on Zomato or Swiggy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Work+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --cream:#FBF3E6;
    --ink:#241209;
    --ink-soft:#5C4A3B;
    --line:#EDE1CE;
    --red:#C81E1E;
    --red-dark:#951414;
    --gold:#B8863B;
    --gold-light:#F1DCA8;

    --c-kolhapuri:#4C7A3D;
    --c-corn:#C1631B;
    --c-dryfruit:#8C2020;
    --c-papdi:#C1631B;
    --c-misal:#9C2F5C;
    --c-khatta:#6E7A1F;
    --c-lasun:#2B5876;
    --c-mix:#4C7A3D;

    --display:'Fraunces', serif;
    --body:'Work Sans', sans-serif;
    --mono:'Space Mono', monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}}

  /* scroll reveal animations */
  .reveal{opacity:0;transform:translateY(28px);transition:opacity 0.7s cubic-bezier(.2,.7,.3,1), transform 0.7s cubic-bezier(.2,.7,.3,1);}
  .reveal.in-view{opacity:1;transform:translateY(0);}
  .reveal-stagger .reveal:nth-child(1){transition-delay:0.05s;}
  .reveal-stagger .reveal:nth-child(2){transition-delay:0.12s;}
  .reveal-stagger .reveal:nth-child(3){transition-delay:0.19s;}
  .reveal-stagger .reveal:nth-child(4){transition-delay:0.26s;}
  .reveal-stagger .reveal:nth-child(5){transition-delay:0.33s;}
  .reveal-stagger .reveal:nth-child(6){transition-delay:0.4s;}
  .reveal-stagger .reveal:nth-child(7){transition-delay:0.47s;}
  .reveal-stagger .reveal:nth-child(8){transition-delay:0.54s;}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;transition:none;}
  }
  .hero-visual .stack{transition:transform 0.1s linear;}
  .count-up{display:inline-block;}

  /* cinematic 3D hero */
  .hero3d{
    position:relative;overflow:hidden;
    background:radial-gradient(ellipse 900px 600px at 15% -10%, rgba(200,30,30,0.08), transparent 60%),
               radial-gradient(ellipse 800px 600px at 90% 100%, rgba(184,134,59,0.14), transparent 60%),
               var(--paper);
    min-height:88vh;display:flex;align-items:center;
  }
  #heroCanvas{position:absolute;inset:0;z-index:1;pointer-events:none;}
  .hero3d .wrap{position:relative;z-index:2;}
  .hero3d .hero-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:40px;align-items:center;padding:60px 0;}
  @media (max-width:900px){.hero3d .hero-grid{grid-template-columns:1fr;}}

  .glass-eyebrow{
    display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;
    color:var(--red-dark);background:var(--gold-light);border:1px solid rgba(184,134,59,0.35);
    padding:8px 16px;border-radius:999px;margin-bottom:24px;font-weight:700;
  }
  .glass-eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 6px 1px rgba(200,30,30,0.5);}

  .hero3d h1{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,5.5vw,3.8rem);line-height:1.1;color:var(--ink);}
  .hero3d h1 em{font-style:normal;color:var(--red);}
  .hero3d p.lede{margin-top:20px;max-width:520px;font-size:1.05rem;color:var(--ink-soft);}

  .hero3d .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px;}
  .glow-btn{
    display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:0.9rem;padding:15px 26px;border-radius:999px;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .glow-btn:hover{transform:translateY(-3px);}
  .glow-gold{background:linear-gradient(90deg,#E8B23D,#C9973F);color:#1C120C;box-shadow:0 8px 30px rgba(232,178,61,0.35);}
  .glow-outline{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 4px 14px rgba(36,18,9,0.06);}

  .hero3d .trust-row{display:flex;flex-wrap:wrap;gap:26px;margin-top:40px;padding-top:26px;border-top:1px solid var(--line);}
  .hero3d .trust-item b{display:block;font-family:var(--display);font-size:1.6rem;color:var(--red);line-height:1;margin-bottom:4px;}
  .hero3d .trust-item span{font-size:0.75rem;color:var(--ink-soft);}

  /* 3D tilt product stage */
  .tilt-stage{perspective:1200px;display:flex;justify-content:center;align-items:center;position:relative;height:460px;}
  .tilt-card{
    position:relative;width:280px;transform-style:preserve-3d;
    transition:transform 0.15s ease-out;
    animation:heroBob 5s ease-in-out infinite;
  }
  @keyframes heroBob{0%,100%{transform:translateY(0px) rotateX(4deg) rotateY(-6deg);}50%{transform:translateY(-16px) rotateX(-2deg) rotateY(6deg);}}
  .tilt-card img{width:100%;filter:drop-shadow(0 40px 60px rgba(0,0,0,0.6));border-radius:14px;}
  .tilt-glow{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);width:220px;height:60px;background:radial-gradient(ellipse,rgba(232,178,61,0.55),transparent 70%);filter:blur(10px);z-index:-1;}
  @media (prefers-reduced-motion: reduce){.tilt-card{animation:none;}}
  @media (max-width:900px){.tilt-stage{height:340px;}.tilt-card{width:220px;}}

  /* ambient floating namkeen particles across whole site */
  .namkeen-field{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden;}
  .namkeen-drift{position:absolute;border-radius:50%;opacity:0.55;animation:driftFloat linear infinite;}
  @keyframes driftFloat{
    0%{transform:translateY(0) translateX(0) rotate(0deg);}
    50%{transform:translateY(-40px) translateX(18px) rotate(180deg);}
    100%{transform:translateY(0) translateX(0) rotate(360deg);}
  }

  /* particles that fly into a product image on reveal */
  .namkeen-bit{
    position:absolute;border-radius:50%;pointer-events:none;z-index:5;
    transition:left 0.9s cubic-bezier(.2,.6,.3,1), top 0.9s cubic-bezier(.2,.6,.3,1), opacity 0.9s ease, transform 0.9s ease;
  }
  @media (prefers-reduced-motion: reduce){
    .namkeen-field{display:none;}
    .namkeen-bit{display:none;}
  }
  header{position:sticky;top:0;z-index:50;background:transparent;backdrop-filter:blur(0px);border-bottom:1px solid transparent;transition:background .3s ease, backdrop-filter .3s ease, border-color .3s ease;}
  header.scrolled{background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  header .brandmark .name, header .nav-links a{color:var(--ink);transition:color .3s ease;}
  header.scrolled .brandmark .name, header.scrolled .nav-links a{color:var(--ink);}
  header .brandmark .name small{color:#E8B23D;}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;}
  .brandmark{display:flex;align-items:center;gap:12px;}
  .brandmark img{width:40px;height:40px;border-radius:50%;box-shadow:0 2px 8px rgba(200,30,30,0.25);}
  .brandmark .name{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--ink);}
  .brandmark .name small{display:block;font-family:var(--mono);font-size:0.58rem;letter-spacing:2px;color:var(--red);text-transform:uppercase;margin-top:2px;font-weight:700;}
  .nav-links{display:flex;gap:30px;font-size:0.9rem;color:var(--ink-soft);font-weight:500;}
  .nav-links a:hover{color:var(--red);}
  .btn-mini{font-family:var(--body);font-weight:700;font-size:0.85rem;background:var(--red);color:#fff;padding:10px 20px;border-radius:8px;}
  .btn-mini:hover{background:var(--red-dark);}
  @media (max-width:760px){.nav-links{display:none;}}

  /* hero */
  .hero{position:relative;padding:70px 0 60px;background:
      radial-gradient(ellipse 700px 400px at 90% -10%, rgba(200,30,30,0.07), transparent 60%),
      radial-gradient(ellipse 600px 400px at 5% 100%, rgba(184,134,59,0.10), transparent 60%),
      var(--paper);}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--red-dark);background:var(--gold-light);padding:7px 16px;border-radius:999px;margin-bottom:26px;font-weight:700;}
  .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);}
  .hero-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:50px;align-items:center;}
  @media (max-width:900px){.hero-grid{grid-template-columns:1fr;}}
  .hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.08;color:var(--ink);}
  .hero h1 em{font-style:normal;color:var(--red);}
  .hero p.lede{margin-top:20px;max-width:520px;font-size:1.08rem;color:var(--ink-soft);}
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px;}
  .cta-btn{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:0.92rem;padding:15px 26px;border-radius:10px;transition:transform .15s ease, box-shadow .15s ease;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
  .cta-btn:hover{transform:translateY(-2px);}
  .cta-zomato{background:#E23744;color:#fff;}
  .cta-swiggy{background:#FC8019;color:#1C120C;}
  .cta-insta{background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);color:#fff;}
  .cta-fb{background:#1877F2;color:#fff;}
  .cta-whatsapp{background:#25D366;color:#0b3d24;}

  /* floating social stack */
  .float-stack{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:12px;align-items:flex-end;}
  .float-btn{
    display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:0.85rem;
    padding:14px 20px;border-radius:999px;box-shadow:0 10px 24px rgba(0,0,0,0.22);
    transition:transform .15s ease;
  }
  .float-btn:hover{transform:translateY(-3px) scale(1.03);}
  .float-btn svg{width:20px;height:20px;flex-shrink:0;}
  .float-whatsapp{background:#25D366;}
  .float-insta{background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);}
  .float-fb{background:#1877F2;}
  @media (max-width:560px){
    .float-btn span{display:none;}
    .float-btn{padding:14px;}
  }
  .trust-row{display:flex;flex-wrap:wrap;gap:26px;margin-top:38px;padding-top:26px;border-top:1px solid var(--line);}
  .trust-item{font-family:var(--body);}
  .trust-item b{display:block;font-family:var(--display);font-size:1.7rem;color:var(--red);line-height:1;margin-bottom:4px;}
  .trust-item span{font-size:0.78rem;color:var(--ink-soft);}

  .hero-visual{position:relative;}
  .hero-visual .stack{position:relative;display:flex;justify-content:center;}
  .hero-visual img{width:70%;filter:drop-shadow(0 24px 40px rgba(0,0,0,0.18));position:relative;z-index:2;}
  .hero-visual .ghost{position:absolute;width:60%;top:8%;left:0;opacity:0.55;transform:rotate(-9deg);z-index:1;filter:drop-shadow(0 18px 30px rgba(0,0,0,0.12));}
  .hero-visual .ghost2{position:absolute;width:58%;top:12%;right:-4%;opacity:0.55;transform:rotate(10deg);z-index:1;filter:drop-shadow(0 18px 30px rgba(0,0,0,0.12));}
  .hero-visual .ring{position:absolute;width:340px;height:340px;border:2px dashed var(--gold-light);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);z-index:0;}

  /* legacy band */
  .legacy{background:linear-gradient(135deg, var(--red-dark), var(--red));color:#fff;padding:0;}
  .legacy-hero{padding:70px 0 50px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.15);}
  .legacy-seal{position:relative;width:180px;height:180px;margin:0 auto 26px;display:flex;align-items:center;justify-content:center;}
  .legacy-seal::before{content:"";position:absolute;inset:0;border:2px dashed rgba(241,220,168,0.5);border-radius:50%;}
  .legacy-seal::after{content:"";position:absolute;inset:14px;border:1px solid rgba(241,220,168,0.3);border-radius:50%;}
  .legacy-seal img{width:120px;height:120px;border-radius:50%;box-shadow:0 12px 30px rgba(0,0,0,0.3);position:relative;z-index:1;}
  .legacy-hero .est{font-family:var(--mono);font-size:0.78rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold-light);font-weight:700;}
  .legacy-hero h2{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,4.5vw,2.7rem);margin-top:12px;max-width:680px;margin-left:auto;margin-right:auto;line-height:1.2;}
  .legacy-hero p.sub{margin-top:16px;color:rgba(255,255,255,0.85);max-width:56ch;margin-left:auto;margin-right:auto;font-size:1.02rem;}
  .legacy-timeline{display:flex;justify-content:center;gap:0;margin-top:36px;flex-wrap:wrap;}
  .legacy-timeline .yr{display:flex;flex-direction:column;align-items:center;padding:0 30px;position:relative;}
  .legacy-timeline .yr:not(:last-child)::after{content:"";position:absolute;right:0;top:8px;width:1px;height:36px;background:rgba(255,255,255,0.25);}
  .legacy-timeline .yr b{font-family:var(--display);font-size:1.4rem;color:var(--gold-light);}
  .legacy-timeline .yr span{font-size:0.75rem;color:rgba(255,255,255,0.75);margin-top:4px;font-family:var(--mono);}

  .legacy .wrap{display:grid;grid-template-columns:1fr 1.4fr;gap:48px;align-items:center;padding:44px 24px;}
  .legacy .tag{font-family:var(--mono);font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold-light);margin-bottom:10px;display:block;font-weight:700;}
  .legacy h3.shop-title{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.22;}
  .legacy p{margin-top:14px;color:rgba(255,255,255,0.88);font-size:0.98rem;max-width:48ch;}
  @media (max-width:760px){.legacy .wrap{grid-template-columns:1fr;}}

  /* products */
  .products{padding:80px 0 30px;background:var(--cream);}
  .section-head{margin-bottom:44px;text-align:left;}
  .section-head .tag{font-family:var(--mono);font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--red);font-weight:700;}
  .section-head h2{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,4vw,2.5rem);margin-top:10px;color:var(--ink);}
  .section-head p{margin-top:10px;color:var(--ink-soft);max-width:56ch;}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
  @media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.grid{grid-template-columns:1fr;}}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column;transition:transform .2s ease, box-shadow .2s ease;box-shadow:0 2px 10px rgba(36,18,9,0.04);}
  .card:hover{transform:translateY(-5px);box-shadow:0 16px 30px rgba(36,18,9,0.12);}
  .card .accent-bar{height:5px;width:100%;}
  .card .imgwrap{background:var(--cream);padding:20px;display:flex;align-items:center;justify-content:center;height:220px;}
  .card .imgwrap img{max-height:184px;width:auto;margin:0 auto;filter:drop-shadow(0 10px 16px rgba(0,0,0,0.14));}
  .card .body{padding:18px 18px 20px;position:relative;flex:1;display:flex;flex-direction:column;}
  .card .spicy{position:absolute;top:-14px;right:16px;font-size:0.68rem;font-family:var(--mono);font-weight:700;background:var(--red);color:#fff;padding:4px 9px;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,0.15);}
  .card h3{font-family:var(--display);font-weight:700;font-size:1.18rem;color:var(--ink);line-height:1.25;}
  .card .desc{font-size:0.85rem;color:var(--ink-soft);margin-top:6px;flex:1;}

  .tag-row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);}
  .weight-price{font-family:var(--mono);}
  .weight-price .w{font-size:0.72rem;color:var(--ink-soft);letter-spacing:1px;}
  .weight-price .p{font-size:1.3rem;color:var(--red);font-weight:700;}
  .weight-price .p2{font-size:0.78rem;color:var(--ink-soft);}

  .order-row{display:flex;gap:8px;margin-top:14px;}
  .order-btn{flex:1;text-align:center;font-family:var(--mono);font-size:0.68rem;font-weight:700;letter-spacing:0.4px;padding:9px 8px;border-radius:8px;border:1.5px solid;background:transparent;}
  .order-btn.z{border-color:#E23744;color:#E23744;}
  .order-btn.z:hover{background:#E23744;color:#fff;}
  .order-btn.s{border-color:#FC8019;color:#c15e0f;}
  .order-btn.s:hover{background:#FC8019;color:#1C120C;}

  /* why us */
  .why{padding:80px 0;background:var(--paper);}
  .why .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;}
  @media (max-width:760px){.why .grid3{grid-template-columns:1fr;}}
  .why-item{padding:28px;border:1px solid var(--line);border-radius:14px;}
  .why-item .num{font-family:var(--mono);font-size:0.75rem;color:var(--red);letter-spacing:2px;font-weight:700;}
  .why-item h3{font-family:var(--display);font-weight:700;font-size:1.25rem;margin-top:10px;color:var(--ink);}
  .why-item p{margin-top:8px;color:var(--ink-soft);font-size:0.92rem;}

  /* platform cta */
  .platform-cta{padding:70px 0;text-align:center;background:var(--cream);}
  .platform-cta h2{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,4vw,2.3rem);color:var(--ink);}
  .platform-cta p{color:var(--ink-soft);margin-top:10px;}
  .platform-buttons{display:flex;justify-content:center;gap:18px;margin-top:32px;flex-wrap:wrap;}

  /* reviews */
  .reviews{padding:80px 0;background:var(--cream);}
  .review-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:36px;}
  @media (max-width:760px){.review-grid{grid-template-columns:1fr;}}
  .review-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;}
  .review-card .stars{color:#F0A93A;font-size:0.95rem;letter-spacing:2px;}
  .review-card p{margin-top:10px;color:var(--ink-soft);font-size:0.95rem;font-style:italic;}
  .review-card .who{margin-top:14px;display:flex;align-items:center;gap:10px;}
  .review-card .avatar{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:0.95rem;}
  .review-card .name{font-weight:700;font-size:0.88rem;}
  .review-card .src{font-family:var(--mono);font-size:0.68rem;color:var(--ink-soft);}
  .review-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:0.72rem;background:var(--gold-light);color:var(--red-dark);padding:6px 14px;border-radius:999px;font-weight:700;margin-top:10px;}

  /* reels */
  .reels{padding:70px 0;background:var(--paper);}
  .reels-scroll{display:flex;gap:18px;overflow-x:auto;margin-top:30px;padding-bottom:10px;-webkit-overflow-scrolling:touch;}
  .reels-scroll::-webkit-scrollbar{height:6px;}
  .reels-scroll::-webkit-scrollbar-thumb{background:var(--gold);border-radius:99px;}
  .reel-embed{flex:0 0 auto;width:320px;max-width:85vw;border-radius:14px;overflow:hidden;border:1px solid var(--line);}
  footer{background:var(--ink);color:var(--gold-light);padding:50px 0 26px;}
  .foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px;}
  @media (max-width:760px){.foot-grid{grid-template-columns:1fr;}}
  footer h4{font-family:var(--mono);font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold-light);margin-bottom:14px;font-weight:700;}
  footer p, footer li{color:rgba(241,220,168,0.75);font-size:0.9rem;}
  footer ul{list-style:none;}
